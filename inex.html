<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Allocation Calculator</title>
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: #f4f6f9;
color: #333;
display: flex;
justify-content: center;
padding: 40px 20px;
margin: 0;
}
.card {
background: #ffffff;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.08);
max-width: 600px;
width: 100%;
padding: 28px;
}
h2 {
margin-top: 0;
color: #1a252c;
font-size: 22px;
border-bottom: 2px solid #eef2f5;
padding-bottom: 12px;
}
.input-group {
margin-bottom: 24px;
}
label {
display: block;
font-weight: 600;
margin-bottom: 8px;
font-size: 14px;
color: #4a5568;
}
.input-wrapper {
position: relative;
display: flex;
align-items: center;
}
.currency-symbol {
position: absolute;
left: 14px;
font-weight: bold;
color: #718096;
font-size: 18px;
}
input[type="number"] {
width: 100%;
padding: 12px 12px 12px 30px;
font-size: 18px;
font-weight: bold;
border: 2px solid #cbd5e0;
border-radius: 8px;
outline: none;
transition: border-color 0.2s;
}
input[type="number"]:focus {
border-color: #3182ce;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
}
th, td {
text-align: left;
padding: 12px 10px;
border-bottom: 1px solid #e2e8f0;
}
th {
background-color: #f7fafc;
color: #4a5568;
font-size: 12px;
text-transform: uppercase;
letter-spacing: 0.5px;
}
td.amount {
font-weight: bold;
color: #2b6cb0;
text-align: right;
}
td.ticker {
font-weight: bold;
}
th.right-align, td.right-align {
text-align: right;
}
tr.total-row {
font-weight: bold;
background-color: #edf2f7;
}
tr.total-row td {
border-bottom: none;
}
</style>
</head>
<body>

<div class="card">
<h2>Portfolio Allocation Calculator</h2>

<div class="input-group">
<label for="portfolioAmount">Total Portfolio Investment ($)</label>
<div class="input-wrapper">
<span class="currency-symbol">$</span>
<input type="number" id="portfolioAmount" value="456000" placeholder="Enter total amount" oninput="calculateAllocations()">
</div>
</div>

<table>
<thead>
<tr>
<th>Ticker</th>
<th>Target Weight</th>
<th class="right-align">Allocated Amount</th>
</tr>
</thead>
<tbody>
<tr>
<td class="ticker">VTI</td>
<td>40%</td>
<td class="amount" id="vti-val">$0</td>
</tr>
<tr>
<td class="ticker">SPMO</td>
<td>30%</td>
<td class="amount" id="spmo-val">$0</td>
</tr>
<tr>
<td class="ticker">SMH</td>
<td>20%</td>
<td class="amount" id="smh-val">$0</td>
</tr>
<tr>
<td class="ticker">AVUV</td>
<td>10%</td>
<td class="amount" id="avuv-val">$0</td>
</tr>
<tr class="total-row">
<td>Total</td>
<td>100%</td>
<td class="right-align" id="total-val">$0</td>
</tr>
</tbody>
</table>
</div>

<script>
function formatCurrency(val) {
return new Intl.NumberFormat('en-US', {
style: 'currency',
currency: 'USD',
maximumFractionDigits: 0
}).format(val);
}

function calculateAllocations() {
const inputVal = parseFloat(document.getElementById('portfolioAmount').value) || 0;

const vti = inputVal * 0.40;
const spmo = inputVal * 0.30;
const smh = inputVal * 0.20;
const avuv = inputVal * 0.10;

document.getElementById('vti-val').innerText = formatCurrency(vti);
document.getElementById('spmo-val').innerText = formatCurrency(spmo);
document.getElementById('smh-val').innerText = formatCurrency(smh);
document.getElementById('avuv-val').innerText = formatCurrency(avuv);
document.getElementById('total-val').innerText = formatCurrency(inputVal);
}

// Run on page load
calculateAllocations();
</script>

</body>
</html>
