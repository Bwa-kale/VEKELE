<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Portfolio Allocation & Rebalancer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #2b6cb0;
  --bg: #f4f6f9;
  --card-bg: #ffffff;
  --text: #2d3748;
  --border: #e2e8f0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 40px 20px;
  margin: 0;
}
.card {
  background: var(--card-bg);
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  max-width: 900px;
  width: 100%;
  padding: 28px;
}
h2 {
  margin-top: 0;
  color: #1a252c;
  font-size: 22px;
  border-bottom: 2px solid #eef2f5;
  padding-bottom: 12px;
}
.grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
@media(max-width: 768px) {
  .grid-container { grid-template-columns: 1fr; }
}
.input-group { margin-bottom: 12px; }
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 13px;
  color: #4a5568;
}
input[type="number"], input[type="text"] {
  width: 100%;
  padding: 10px;
  font-size: 15px;
  border: 2px solid #cbd5e0;
  border-radius: 6px;
  outline: none;
  box-sizing: border-box;
}
input:focus { border-color: var(--primary); }
.chart-container {
  position: relative;
  max-height: 250px;
  display: flex;
  justify-content: center;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
th {
  background-color: #f7fafc;
  color: #4a5568;
  font-size: 11px;
  text-transform: uppercase;
}
td.right, th.right { text-align: right; }
.action-buy { color: #2f855a; font-weight: bold; }
.action-sell { color: #c53030; font-weight: bold; }
.btn-row {
  margin-top: 15px;
  display: flex;
  gap: 10px;
}
button {
  padding: 8px 16px;
  background-color: var(--primary);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}
button.secondary { background-color: #718096; }
button:hover { opacity: 0.9; }
.alert {
  padding: 10px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 12px;
  margin-top: 10px;
  display: none;
}
.alert-error { background-color: #fed7d7; color: #9b2c2c; }
</style>
</head>
<body>

<div class="card">
  <h2>Portfolio Allocation & Rebalance Dashboard</h2>

  <div class="grid-container">
    <div>
      <div class="input-group">
        <label for="portfolioAmount">Target Portfolio Total ($)</label>
        <input type="number" id="portfolioAmount" value="456000" oninput="calculate()">
      </div>
      <div id="weightAlert" class="alert alert-error">Total weight must equal 100%!</div>
      <div class="btn-row">
        <button onclick="addAsset()">+ Add Ticker</button>
        <button class="secondary" onclick="resetDefaults()">Reset</button>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="allocationChart"></canvas>
    </div>
  </div>

  <table id="assetTable">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Price ($)</th>
        <th>Target Weight (%)</th>
        <th class="right">Current Value ($)</th>
        <th class="right">Target Value ($)</th>
        <th class="right">Target Shares</th>
        <th class="right">Rebalance Action</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
let defaultAssets = [
  { ticker: 'VTI', price: 240, weight: 40, current: 150000 },
  { ticker: 'SPMO', price: 75, weight: 30, current: 120000 },
  { ticker: 'SMH', price: 220, weight: 20, current: 110000 },
  { ticker: 'AVUV', price: 85, weight: 10, current: 40000 }
];

let assets = JSON.parse(localStorage.getItem('portfolioAssets')) || defaultAssets;
let chartInstance = null;

function saveState() {
  localStorage.setItem('portfolioAssets', JSON.stringify(assets));
  localStorage.setItem('portfolioTotal', document.getElementById('portfolioAmount').value);
}

function loadState() {
  const savedTotal = localStorage.getItem('portfolioTotal');
  if (savedTotal) document.getElementById('portfolioAmount').value = savedTotal;
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  assets.forEach((asset, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${asset.ticker}" onchange="updateAsset(${index}, 'ticker', this.value)" style="width:70px"></td>
      <td><input type="number" value="${asset.price}" oninput="updateAsset(${index}, 'price', parseFloat(this.value)||0)" style="width:70px"></td>
      <td><input type="number" value="${asset.weight}" oninput="updateAsset(${index}, 'weight', parseFloat(this.value)||0)" style="width:60px">%</td>
      <td class="right"><input type="number" value="${asset.current}" oninput="updateAsset(${index}, 'current', parseFloat(this.value)||0)" style="width:90px" class="right"></td>
      <td class="right" id="target-val-${index}">$0</td>
      <td class="right" id="target-shares-${index}">0</td>
      <td class="right" id="action-${index}">-</td>
      <td><button class="secondary" onclick="removeAsset(${index})" style="padding:4px 8px; font-size:11px;">X</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function updateAsset(index, key, value) {
  assets[index][key] = value;
  calculate();
}

function addAsset() {
  assets.push({ ticker: 'NEW', price: 100, weight: 0, current: 0 });
  renderTable();
  calculate();
}

function removeAsset(index) {
  assets.splice(index, 1);
  renderTable();
  calculate();
}

function resetDefaults() {
  assets = JSON.parse(JSON.stringify(defaultAssets));
  document.getElementById('portfolioAmount').value = 456000;
  renderTable();
  calculate();
}

function formatCurrency(val) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
}

function initChart() {
  const ctx = document.getElementById('allocationChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: [],
      datasets: [{ data: [], backgroundColor: ['#3182ce', '#38a169', '#dd6b20', '#805ad5', '#e53e3e', '#319795'] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function calculate() {
  const targetTotal = parseFloat(document.getElementById('portfolioAmount').value) || 0;
  let totalWeight = 0;

  assets.forEach((asset, i) => {
    totalWeight += asset.weight;
    const targetVal = targetTotal * (asset.weight / 100);
    const shares = asset.price > 0 ? Math.floor(targetVal / asset.price) : 0;
    const rebalanceDiff = targetVal - asset.current;

    document.getElementById(`target-val-${i}`).innerText = formatCurrency(targetVal);
    document.getElementById(`target-shares-${i}`).innerText = shares.toLocaleString();
    
    const actionCell = document.getElementById(`action-${i}`);
    if (rebalanceDiff > 0) {
      actionCell.innerText = `Buy ${formatCurrency(rebalanceDiff)}`;
      actionCell.className = 'right action-buy';
    } else if (rebalanceDiff < 0) {
      actionCell.innerText = `Sell ${formatCurrency(Math.abs(rebalanceDiff))}`;
      actionCell.className = 'right action-sell';
    } else {
      actionCell.innerText = 'Balanced';
      actionCell.className = 'right';
    }
  });

  // Validation
  const alert = document.getElementById('weightAlert');
  alert.style.display = totalWeight !== 100 ? 'block' : 'none';

  // Update Chart
  if (chartInstance) {
    chartInstance.data.labels = assets.map(a => a.ticker);
    chartInstance.data.datasets[0].data = assets.map(a => a.weight);
    chartInstance.update();
  }

  saveState();
}

// Startup
loadState();
renderTable();
initChart();
calculate();
</script>

</body>
</html>
